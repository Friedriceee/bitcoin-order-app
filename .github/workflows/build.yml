name: Workshop 6 - Build, Test and Deploy

on:
  push:
    branches:
      - githubcicd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install --no-save @types/node@14.18.63 --legacy-peer-deps

      - name: Static type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build -- --base-href=/bitcoin-order-app/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bitcoin

  report-build-status:
    name: Report build status
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Report successful build
        run: echo "Build, tests, and artifact upload completed successfully."

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
