name: SAST Scan

on:
  push:
    branches: [githubcicd]
  workflow_dispatch:

concurrency:
  group: sast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download OWASP Dependency-Check
        run: |
          curl --fail --location --retry 3 \
            --output dependency-check.zip \
            https://github.com/dependency-check/DependencyCheck/releases/download/v12.1.1/dependency-check-12.1.1-release.zip
          unzip -q dependency-check.zip -d "$HOME/dependency-check"

      - name: Run OWASP Dependency-Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.WORKSHOP6_NVD_API_KEY }}
        run: |
          mkdir -p dependency-check-results
          "$HOME/dependency-check/dependency-check/bin/dependency-check.sh" \
            --project "bitcoin-order-app" \
            --nvdApiKey "$NVD_API_KEY" \
            --format HTML \
            --out dependency-check-results \
            --scan . \
            --disableOssIndex \
            2>&1 | tee dependency-check-results/dependency-check.log

      - name: Verify SAST report
        run: test -f dependency-check-results/dependency-check-report.html

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: dependency-check-results/
          if-no-files-found: error
