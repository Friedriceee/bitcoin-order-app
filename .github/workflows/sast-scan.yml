name: SAST Scan

on:
  push:
    branches: [githubcicd]
  workflow_dispatch:

concurrency:
  group: sast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run static dependency vulnerability scan
        run: |
          mkdir -p sast-results
          npm audit --json > sast-results/sast-report.json || true
          npm audit > sast-results/sast-report.txt || true
          test -s sast-results/sast-report.json

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-results/
          if-no-files-found: error
